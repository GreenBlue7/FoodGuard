server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API requests go to the backend container with the /api prefix kept as-is
    location /api/ {
        proxy_pass http://backend:8080;
        # Inspections wait for the judge synchronously; this must exceed the backend's
        # JUDGE_TIMEOUT_MS so the backend's own timeout result reaches the browser first
        proxy_read_timeout 180s;
    }

    # Vue Router uses history mode: paths without a real file fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
