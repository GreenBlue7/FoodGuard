server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Docker may assign a new address when backend is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # API requests go to the backend container with the /api prefix kept as-is
    location /api/ {
        set $backend_url http://backend:8080;
        proxy_pass $backend_url$request_uri;
        # Inspection POST returns a ticket immediately; GET polls the durable job.
        proxy_read_timeout 180s;
    }

    # Vue Router uses history mode: paths without a real file fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
