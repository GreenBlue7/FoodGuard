<style nonce="__NONCE__">
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#242d35;background:#e9e9e7;font-size:14px;line-height:1.8}

@media screen and (max-width:640px){main{padding:24px 18px;margin-bottom:0;border-left:0;border-right:0}.toolbar{padding:0 15px}.document-line{flex-wrap:wrap;gap:4px}.document-no{font-size:10px}h1{font-size:23px;margin-top:20px}.identity,.identity tbody,.identity tr{display:block}.identity tr{display:grid;grid-template-columns:85px minmax(0,1fr)}.identity th,.identity td{display:block;border-right:0!important}.identity th{font-size:11px}.identity td{font-size:12px}.findings,.findings tbody{display:block}.findings colgroup{display:none}.findings thead{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}.findings tr{display:block;border:1px solid #c4cdd3;margin:14px 0}.findings td{display:grid;grid-template-columns:68px minmax(0,1fr);gap:9px;border-left:0;border-bottom:1px solid #e1e5e8;padding:10px 11px!important}.findings td:before{content:attr(data-label);font-size:10px;font-weight:400;color:#78838b;white-space:normal}.findings .row-number{text-align:left;border-left:0!important}.findings .quote{font-size:13px}.findings .opinion{display:block}.findings .opinion:before{display:block;margin-bottom:5px}.findings tr.violation{border-top:2px solid #9d5352}.findings tr.review{border-top:2px solid #b49b71}.findings tr td:last-child{border-bottom:0}footer{display:block}footer p+p{margin-top:7px}}
